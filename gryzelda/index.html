ty! Dofinansowanie przyznane, most powstanie w nast\u0119pnej perspektywie finansowej. Masz 45 groszy i punkt. Awansowa\u0142a\u015B na moj\u0105 ulubion\u0105 petentk\u0119.",reward:{c:45,xp:30,p:1}},{id:"zdz1",name:"Zaginiony pacho\u0142ek",giver:"zdzich",kind:"fetch",where:"Las Szept\xF3w, polana na p\xF3\u0142nocnym wschodzie",ask:"Czemu pan tak smutno patrzy na drog\u0119?",offer:"Bo zgubi\u0142em pacho\u0142ek! Pomara\u0144czowy, w paski, jedyny w gminie. Gluty porwa\u0142y go do Lasu Szept\xF3w, pewnie my\u015Bl\u0105, \u017Ce to wielki cukierek. Bez pacho\u0142ka nikt nie wie, gdzie jest dziura, i wszyscy w ni\u0105 wpadaj\u0105.",accept:"Jak go znajdziesz, przynie\u015B. Postawi\u0119 go przy dziurze i dziura b\u0119dzie jak nowa.",prog:"Pacho\u0142ek dalej w Lesie Szept\xF3w, dziura dalej w drodze, a ja dalej oparty o \u0142opat\u0119.",turn:"Oddaj pacho\u0142ek",done:"M\xF3j pacho\u0142ek! Pachnie lasem i glutem. Masz 20 groszy. I nie m\xF3w nikomu, \u017Ce \u0142opata to m\xF3j g\u0142\xF3wny element konstrukcyjny.",reward:{c:20,xp:25},item:{z:2,tx:45,ty:5,name:"Pacho\u0142ek drogowy"}},{id:"gra1",name:"Szarlotka dla Babci",giver:"grazyna",kind:"deliver",where:"Wioska, Babcia Jadzia przy karczmie",ask:"Co tak pi\u0119knie pachnie?",offer:"Szarlotka! Upiek\u0142am dla Babci Jadzi, ale jak p\xF3jd\u0119 sama, to zostan\u0119 na trzy godziny i wys\u0142ucham historii o Mruczku od pocz\u0105tku. Zaniesiesz? Tylko nie podjadaj, policzy\u0142am kawa\u0142ki.",accept:"Babcia Jadzia zwykle stoi przy karczmie, na p\xF3\u0142nocny wsch\xF3d od placu. Szarlotka jest jeszcze ciep\u0142a, nie biegaj z ni\u0105 po krzakach.",prog:"Szarlotka czeka na podr\xF3\u017C do Babci Jadzi. Ja czekam na pochwa\u0142y.",to:"jadzia",toAsk:"Szarlotka od Gra\u017Cyny",toTxt:"Od Gra\u017Cynki? Ojej, z kruszonk\u0105! Powiedz jej, \u017Ce za s\u0142odka, ale zjem ca\u0142\u0105, \u017Ceby si\u0119 nie zmarnowa\u0142a.",turn:"Babcia dzi\u0119kuje za szarlotk\u0119",done:"Za s\u0142odka 27,name:"Pi\u0142ka w kropki"}},{id:"dar1",name:"Paczka bez adresu",giver:"darek",kind:"fetch",where:"Zachodnie Pola Ticket\xF3w, po\u0142udniowy zach\xF3d",ask:"Pan kurier? Co si\u0119 sta\u0142o?",offer:"Mam paczk\u0119 bez adresu, czyli tak\u0105, kt\xF3ra dostarcza si\u0119 sama. No i si\u0119 dostarczy\u0142a, gdzie\u015B na Zachodnie Pola Ticket\xF3w. Status w systemie: \u201EPaczka w drodze\u201D. Od trzech tygodni.",accept:"Jak j\u0105 znajdziesz, przynie\u015B. Zeskanuj\u0119 i zmieni\u0119 status na \u201EDor\u0119czono\u201D, zanim kto\u015B z\u0142o\u017Cy reklamacj\u0119 reklamacji.",prog:"Paczka wci\u0105\u017C na Zachodnich Polach. Status: \u201Eawizo zostawione w krzakach\u201D.",turn:"Oddaj zgubion\u0105 paczk\u0119",done:"Pip! Zeskanowana. Status: \u201EDor\u0119czono do r\u0105k w\u0142asnych\u201D. Czyich? Niewa\u017Cne, system jest zadowolony. Masz 35 groszy.",reward:{c:35,xp:35},item:{z:9,tx:6,ty:24,name:"Paczka bez adresu"}},{id:"ola1",name:"Gluty w koniczynie",giver:"ola",kind:"kill",where:"\u0141\u0105ka Czekania",ask:"Gdzie s\u0105 twoje owce?",offer:"Schowa\u0142y si\u0119 w stodole, bo gluty zjadaj\u0105 mi koniczyn\u0119! Zjedz\u0105 wszystko, co zielone, a potem si\u0119 na tym po\u015Blizgn\u0105. Rozlej pi\u0119\u0107 glut\xF3w na \u0141\u0105ce, to owce wyjd\u0105.",accept:"Uwa\u017Caj, gluty s\u0105 lepkie. I nie m\xF3w owcom, \u017Ce boj\u0119 si\u0119 glut\xF3w bardziej ni\u017C one.",prog:"Rozlane gluty: {n}/5. Owce dalej obra\u017Cone.",turn:"Gluty rozlane!",done:"Owce wysz\u0142y! Pierwsza bekn\u0119\u0142a, druga zjad\u0142a mi kapelusz. Czyli wszystko wraca do normy. Masz 25 groszy i punkt.",reward:{c:25,xp:20,p:1},kill:{kind:"slime",z:1,n:5,at:[[8,21],[14,9],[27,12],[46,20],[53,12]]}},{id:"rys1",name:"Z\u0142ota b\u0142ystka",giver:"rysiek",kind:"fetch",where:"Las Szept\xF3w, wschodni las",ask:"Bior\u0105 dzisiaj?",offer:"Bior\u0105, tylko nie ryby, a gluty. Zgubi\u0142em z\u0142ot\u0105 b\u0142ystk\u0119, kiedy goni\u0142em z\u0142otego gluta. My\u015Bla\u0142em, \u017Ce to z\u0142ota rybka, a to by\u0142 zwyk\u0142y bezczelny glut. B\u0142ystka polecia\u0142a do Lasu Szept\xF3w, na wsch\xF3d.",accept:"Z\u0142ota, b\u0142yszcz\u0105ca, z haczykiem. Uwa\u017Caj na palce. I na gluty. I na moj\u0105 reputacj\u0119.",prog:"Bez b\u0142ystki \u0142owi\u0119 na kawa\u0142ek kanapki. Ryby si\u0119 ze mnie \u015Bmiej\u0105.",turn:"Oddaj z\u0142ot\u0105 b\u0142ystk\u0119",done:"Moja b\u0142ystka! Ryb\u0119, kt\xF3r\u0105 na ni\u0105 z\u0142owi\u0119, b\u0119dzie TAKA! (Rysiek rozk\u0142ada r\u0119ce coraz szerzej.) Masz 20 groszy.",reward:{c:20,xp:25},item:{z:2,tx:51,ty:21,name:"Z\u0142ota b\u0142ystka"}},{id:"edk1",name:"Koszyk grzybiarza",giver:"edek",kind:"fetch",where:"Las Szept\xF3w, po\u0142udniowo-zachodnia polana",ask:"Du\u017Co dzi\u015B grzyb\xF3w?",offer:"Grzyb\xF3w pe\u0142no, tylko koszyka nie mam! Odstawi\u0142em go na chwil\u0119, \u017Ceby pogada\u0107 z sosn\u0105, i kto\u015B mi go zwin\u0105\u0142. Podejrzewam nietoperze, maj\u0105 chytre oczka. Lecia\u0142y na po\u0142udnie.",accept:"Wiklinowy, z kraciast\u0105 chusteczk\u0105. W \u015Brodku jest kanapka z d\u017Cemem, nie zjadaj.",prog:"Wci\u0105\u017C bez koszyka. Zbieram grzyby do kapelusza i mam teraz pieczark\u0119 na g\u0142owie.",turn:"Oddaj koszyk",done:"M\xF3j koszyk! I kanapka nietkni\u0119ta, szacunek. Masz 20 groszy i punkt. I rad\u0119: grzyby, kt\xF3re m\xF3wi\u0105, lepiej omija\u0107.",reward:{c:20,xp:20,p:1},item:{z:2,tx:4,ty:35,name:"Koszyk grzybiarza"}},{id:"sta1",name:"Strach na tickety",giver:"staszek",kind:"kill",where:"Zachodnie Pola Ticket\xF3w",ask:"Czemu stoisz jak strach na wr\xF3ble?",offer:"Bo jestem strachem na tickety! Tylko \u017Ce one si\u0119 mnie nie boj\u0105. Lataj\u0105, wisz\u0105 nad polem i przypominaj\u0105 o terminach. Przego\u0144 cztery, to reszta zrozumie aluzj\u0119.",accept:"Tickety strzelaj\u0105 papierem, uwa\u017Caj. Pom\xF3g\u0142bym, ale mam alergi\u0119 na formularze.",prog:"Przegonione tickety: {n}/4.",turn:"Tickety przegonione!",done:"Cisza! Pierwszy raz od lat s\u0142ysz\u0119, jak ro\u015Bnie pszenica. Masz 50 groszy i punkt. I s\u0142omk\u0119 na pami\u0105tk\u0119.",reward:{c:50,xp:40,p:1},kill:{kind:"ticket",z:9,n:4,at:[[14,16],[24,22],[36,9],[40,23]]}},{id:"mir1",name:"Cisza na bagnach",giver:"mirek",kind:"kill",where:"Po\u0142udniowe Bagna SLA",ask:"Pustelnik na bagnach? Czemu?",offer:"Uciek\u0142em tu od zgie\u0142ku, a tu chodz\u0105 zombie z helpdesku i j\u0119cz\u0105: \u201Eczy pr\xF3bowa\u0142 pan wy\u0142\u0105czy\u0107 i w\u0142\u0105czy\u0107?\u201D. Pr\xF3bowa\u0142em. Siebie. Nie pomog\u0142o. Ucisz trzech, prosz\u0119.",accept:"Tylko delikatnie, oni te\u017C kiedy\u015B byli lud\u017Ami. Konsultantami, ale jednak.",prog:"Uciszone zombie: {n}/3. Wci\u0105\u017C s\u0142ysz\u0119 \u201EPana zg\u0142oszenie jest dla nas wa\u017Cne\u201D.",turn:"Zombie uciszone",done:"Cisza... S\u0142ycha\u0107 nawet \u017Caby. Masz 55 groszy i punkt. I m\u0105dro\u015B\u0107 pustelnika: nigdy nie czytaj regulaminu do ko\u0144ca.",reward:{c:55,xp:45,p:1},kill:{kind:"zombie",z:11,n:3,at:[[22,26],[8,24],[26,8]]}},{id:"hen1",name:"Krecha Henia",giver:"henio",kind:"talk",where:"Karczma, Mietek za barem",ask:"Czemu pan taki smutny nad tym kuflem?",offer:"Kufel pusty, a Mietek m\xF3wi, \u017Ce krecha pe\u0142na. Id\u017A, powiedz mu, \u017Ce oddam w przysz\u0142ym tygodniu. Tylko wiarygodnie! Tak urz\u0119dowo.",accept:"Mietek stoi za barem. Powiedz, \u017Ce Henio jest wyp\u0142acalny. Nie m\xF3w tylko od kiedy.",prog:"Czekam na odpowied\u017A Mietka. Kufel czeka ze mn\u0105.",to:"mietek",toAsk:"Henio prosi o dolewk\u0119 na krech\u0119",toTxt:"Henio? Jego krecha jest d\u0142u\u017Csza ni\u017C kolejka do supportu! Powiedz mu, \u017Ce dostanie lemoniad\u0119. Za darmo. Jedn\u0105. I niech przestanie \u015Bpiewa\u0107 z bardem.",turn:"Mietek daje lemoniad\u0119",done:"Lemoniada za darmo? To lepsze ni\u017C kredyt! Masz 10 groszy, znalaz\u0142em pod sto\u0142em. Nie pytaj, ile jeszcze tam le\u017Cy.",reward:{c:10,xp:15}},{id:"kub1",name:"Raport sta\u017Cysty",giver:"kuba",kind:"deliver",where:"Kraina Nieumar\u0142ego Supportu, Duch Helpdesku",ask:"Sta\u017Cysta w Krainie Nieumar\u0142ych?",offer:"Mam zanie\u015B\u0107 raport kwartalny Duchowi Helpdesku, ale boj\u0119 si\u0119 duch\xF3w. I raport\xF3w. Kierownik m\xF3wi, \u017Ce sta\u017C to przygoda. Zaniesiesz za mnie?",accept:"Duch unosi si\u0119 na zach\xF3d od g\u0142\xF3wnej \u015Bcie\u017Cki. M\xF3wi \u201Eprosz\u0119 czeka\u0107\u201D, wi\u0119c pewnie jeszcze tam jest.",prog:"Raport wci\u0105\u017C u ciebie. Ja wci\u0105\u017C na sta\u017Cu. Czwarty rok.",to:"ghost",toAsk:"Raport kwartalny od sta\u017Cysty Kuby",toTxt:"Raport? Za kt\xF3ry kwarta\u0142? Aha, za ten, kt\xF3ry jeszcze si\u0119 nie sko\u0144czy\u0142. Ambitny ch\u0142opak. Przeka\u017C mu: zatwierdzony bez czytania.",turn:"Raport zatwierdzony",done:"Zatwierdzony bez czytania?! To najwy\u017Csza forma uznania w korporacji! Masz 60 groszy i punkt. Mo\u017Ce wreszcie mnie zatrudni\u0105.",reward:{c:60,xp:50,p:1}}],U0={kamila:2,zdzich:2,grazyna:2,filip:3,darek:2,ola:3,edek:2,staszek:2,mirek:1,kuba:2,rysiek:0,henio:0},up={zdzich:["Dzie\u0144 dobry! To nie jest dziura w drodze, tylko inwestycja w toku.","Pracuj\u0119 tu od rana. G\u0142\xF3wnie trzymam \u0142opat\u0119, \u017Ceby nie uciek\u0142a.","Pani Kamila m\xF3wi, \u017Ce remont sko\u0144czy si\u0119 w terminie. Nie powiedzia\u0142a w kt\xF3rym."],grazyna:["S\u0142ysza\u0142a\u015B? Mietek dolewa wody do gulaszu. A Bogdan wybiela brod\u0119, \u017Ceby wygl\u0105da\u0107 m\u0105drzej.","Ja nie plotkuj\u0119. Ja tylko szybko przekazuj\u0119 informacje dalej.","Bard Zbyszek \u015Bpiewa tak, \u017Ce moje pelargonie same si\u0119 zamkn\u0119\u0142y."],filip:["Cze\u015B\u0107! Jestem Filip i jestem prawie doros\u0142y. Prawie-prawie.","Umiem gwizda\u0107, liczy\u0107 do tysi\u0105ca i robi\u0107 min\u0119 jak glut. Patrz! ...No, prawie.","Jak dorosn\u0119, to b\u0119d\u0119 bohaterem. Albo kurierem. Kurier ma fajniejsze auto."],darek:["Kurier Darek. Dostawa w 24 godziny. Kt\xF3rych, tego nie precyzujemy.","Zostawi\u0142em awizo na drzewie. Drzewo nie odebra\u0142o.","Dzwoni\u0142em domofonem, ale w Wiosce nie ma domofon\xF3w, wi\u0119c krzycza\u0142em."],ola:["Owce licz\u0119 przed snem, a w dzie\u0144 to one licz\u0105 mnie.","To \u0141\u0105ka Czekania, bo owce czekaj\u0105 na traw\u0119, a trawa na deszcz.","M\xF3j baran nazywa si\u0119 Support, bo te\u017C nigdy nie odpowiada."],rysiek:["Ciii... ryby s\u0142uchaj\u0105.","Raz z\u0142owi\u0142em tak\u0105 ryb\u0119, \u017Ce sama nie uwierzy\u0142a.","W\u0119dkarstwo to cierpliwo\u015B\u0107. Prawie jak czekanie na support, tylko czasem co\u015B bierze."],edek:["Grzyby to moje \u017Cycie. Gluty to moja zmora: wygl\u0105daj\u0105 jak kurki, a gryz\u0105 jak sprawozdanie roczne.","Tego zielonego, \u015Bwiec\u0105cego, nie jedz. Halina je zbiera, a sama ju\u017C \u015Bwieci.","W tym lesie trzeba szepta\u0107. Ja szepcz\u0119 do borowik\xF3w."],staszek:["Siej\u0119 zbo\u017Ce, a wyrastaj\u0105 tickety. Co\u015B jest nie tak z t\u0105 gleb\u0105.","M\xF3j traktor ma wi\u0119cej b\u0142\u0119d\xF3w ni\u017C system zg\u0142osze\u0144.","Jak b\u0119dzie urodzaj, sprzedam pszenic\u0119. Jak nie, sprzedam tickety na makulatur\u0119."],mirek:["Pustelnik Mirek. Rozmawiam z lud\u017Ami raz w roku. Masz szcz\u0119\u015Bcie, to dzisiaj.","Kiedy\u015B by\u0142em kierownikiem projektu. Teraz kieruj\u0119 \u017Cabami. S\u0142uchaj\u0105 lepiej.","Bagno uczy pokory. Wchodzisz i od razu jeste\u015B ni\u017Cej."],henio:["Siedz\u0119 tu od otwarcia karczmy. Albo od zamkni\u0119cia, ju\u017C nie pami\u0119tam.","Wiesz, \u017Ce ja tu siedz\u0119 ca\u0142y czas? Nawet jak wychodzisz z karczmy. A mo\u017Ce wtedy znikam? Nigdy nie sprawdza\u0142em.","Bard \u015Bpiewa trzeci\u0105 godzin\u0119. To dopiero by\u0142o intro."],kuba:["Sta\u017Cysta Kuba. Pracuj\u0119 za do\u015
