dziesi\u0119\u0107.",reward:{c:150,xp:200,p:1},steps:[{t:"talk",to:"darek",ask:"Gdzie si\u0119 podzia\u0142 wykonawca mostu?",hint:"Kurier Darek, Wioska",txt:"Wykonawca? Odsy\u0142aj\u0105 mi polecone z Krainy Nieumar\u0142ych. Ostatnie z dopiskiem \u201Eprace w toku od 2009\u201D. Siedzi tam na wsch\xF3d od \u015Bcie\u017Cki i straszy petent\xF3w harmonogramem. Jak go spotkasz, nie podpisuj \u017Cadnego aneksu.",ok:"Nie podpisz\u0119"},{t:"kill",kind:"zombie",z:13,n:1,at:[[24,12]],elite:"Wykonawca Widmo",hint:"pokonaj Wykonawc\u0119 Widmo w Krainie Nieumar\u0142ych (elitarny!)",fin:"Wykonawca Widmo rozpada si\u0119, j\u0119cz\u0105c \u201Etermin by\u0142 orientacyjny...\u201D. Na ziemi zosta\u0142a koperta."},{t:"item",z:13,tx:24,ty:12,name:"Koperta z zaliczk\u0105",ic:"moneta",hint:"Kraina Nieumar\u0142ych: tam, gdzie straszy\u0142 Wykonawca",fin:"Zaliczka, prawie ca\u0142a. Brakuje tylko na kaw\u0119, kt\xF3r\u0105 Widmo pi\u0142o na budowie. Pan Zdzisiek powinien to zobaczy\u0107, zanim uwierzy."},{t:"talk",to:"zdzich",ask:"Panie Zdzisiu, odzyska\u0142am zaliczk\u0119!",hint:"Pan Zdzisiek, Wioska",txt:"Zaliczka? Odzyskana? W gminie? Pierwszy raz od czas\xF3w, kiedy \u0142opaty by\u0142y z drewna. (Opiera si\u0119 mocniej o \u0142opat\u0119 ze wzruszenia.) Le\u0107 z tym do Pani Kamili, zanim kto\u015B og\u0142osi przetarg na jej wydanie.",ok:"Lec\u0119"}]},{id:"kam6",name:"Odbi\xF3r ko\u0144cowy",giver:"kamila",after:"kam5",ask:"Jak tam most?",offer:"Most ma nowego wykonawc\u0119, teraz odbi\xF3r ko\u0144cowy. Komisja przys\u0142a\u0142a Rzeczoznawc\u0119 i Inspektora Nadzoru. Problem: obaj pomylili teren budowy z poligonem i atakuj\u0105 wszystko, co ma kask. I wszystko, co go nie ma. Rzeczoznawca szar\u017Cuje po Zachodnich Polach, Inspektor okopa\u0142 si\u0119 na Bagnach SLA.",accept:"Przekonaj ich do podpisu. Delikatnie, ale skutecznie. Jak w urz\u0119dzie, tylko z wi\u0119ksz\u0105 liczb\u0105 siniak\xF3w.",prog:"Odbi\xF3r ko\u0144cowy: {s}/2 podpis\xF3w. Most czeka. Ja czekam. Kawa stygnie.",turn:"Oba podpisy s\u0105!",done:"Odbi\xF3r ko\u0144cowy bez uwag! Most oficjalnie istnieje, nie tylko w kosztorysie. Masz 200 groszy i dwa punkty. A teraz siadaj i m\xF3w, co u ciebie. Tak normalnie, po kole\u017Ce\u0144sku.",reward:{c:200,xp:260,p:2},steps:[{t:"kill",kind:"charger",z:9,n:1,at:[[30,14]],elite:"Rzeczoznawca Szar\u017Cuj\u0105cy",hint:"pokonaj Rzeczoznawc\u0119 Szar\u017Cuj\u0105cego na Zachodnich Polach (elitarny!)",fin:"Rzeczoznawca hamuje w bru\u017Adzie i podpisuje wycen\u0119: \u201Eboli bardzo, warto\u015B\u0107 rynkowa: du\u017Ca\u201D. Teraz Inspektor Nadzoru na Po\u0142udniowych Bagnach SLA."},{t:"kill",kind:"shield",z:11,n:1,at:[[18,20]],elite:"Inspektor Nadzoru",hint:"pokonaj Inspektora Nadzoru na Po\u0142udniowych Bagnach (elitarny!)",fin:"Inspektor sk\u0142ada tarcz\u0119 i podpisuje odbi\xF3r: \u201EBez uwag. Prosz\u0119 ju\u017C nie nadzorowa\u0107 mnie broni\u0105\u201D. Wracaj do Pani Kamili."}]},{id:"zdz1",name:"Zaginiony pacho\u0142ek",giver:"zdzich",ask:"Czemu pan tak smutno patrzy na drog\u0119?",offer:"Bo zgubi\u0142em pacho\u0142ek! Pomara\u0144czowy, w paski, jedyny w gminie. Gluty go wytoczy\u0142y w stron\u0119 Lasu Szept\xF3w. Grzybiarz Edek tam \u0142azi od \u015Bwitu, mo\u017Ce co\u015B widzia\u0142. Bez pacho\u0142ka wszyscy wpadaj\u0105 w dziur\u0119.",accept:"Edek zbiera grzyby w zachodniej cz\u0119\u015Bci lasu. Jak co\u015B wie, to powie. Jak nie wie, to te\u017C powie, tylko d\u0142u\u017Cej.",prog:"Pacho\u0142ek dalej w terenie, dziura dalej w drodze, a ja dalej oparty o \u0142opat\u0119.",turn:"Oddaj pacho\u0142ek",done:"M\xF3j pacho\u0142ek! Pachnie piwnic\u0105 i glutem. Masz 50 groszy. I nie m\xF3w nikomu, \u017Ce \u0142opata to m\xF3j g\u0142\xF3wny element konstrukcyjny.",reward:{c:50,xp:55},steps:[{t:"talk",to:"edek",ask:"Widzia\u0142 pan pomara\u0144czowy pacho\u0142ek?",hint:"Grzybiarz Edek, Las Szept\xF3w (zach\xF3d)",txt:"Widzia\u0142em! Gluty toczy\u0142y go przez las a\u017C do chaty na p\xF3\u0142nocnym wschodzie. Chyba chc\u0105 z niego zrobi\u0107 czapk\u0119 dla Kr\xF3la. Szukaj pod chat\u0105, w korzeniach. Gluty lubi\u0105 piwnice, tam jest wilgotno i nikt nie sprz\u0105ta.",ok:"Sprawdz\u0119 pod chat\u0105"},{t:"item",z:34,tx:7,ty:6,name:"Pacho\u0142ek drogowy",ic:"zdz1",hint:"Korzenie pod Chat\u0105 w Lesie (Las Szept\xF3w, p\xF3\u0142nocny wsch\xF3d)",fin:"Pacho\u0142ek! Kto\u015B mu domalowa\u0142 oczy. Wracaj do Pana Zdzi\u015Bka."}]},{id:"gra1",name:"Szarlotka na zgod\u0119",giver:"grazyna",ask:"Pani Gra\u017Cyno, potrzebuje pani czego\u015B?",offer:"Pok\u0142\xF3ci\u0142am si\u0119 z kuzynk\u0105 Halin\u0105 z Lasu o przepis na szarlotk\u0119. Upiek\u0119 jej na zgod\u0119, ale brakuje mi dzikich jab\u0142ek z po\u0142udnia \u0141\u0105ki Czekania i szczypty cynamonu od Igi z Apteki. Potem zaniesiesz j\u0105 Halinie. Do Lasu. Daleko. I nie podjadaj, policz\u0119 kawa\u0142ki.",accept:"Jab\u0142onka ro\u015Bnie na samym po\u0142udniu \u0141\u0105ki. Iga ma aptek\u0119 w Wiosce, przy g\u0142\xF3wnej drodze. Kolejno\u015B\u0107 nie gra roli, byle jab\u0142ka nie by\u0142y od glut\xF3w.",prog:"Szarlotka czeka na sk\u0142adniki. Ja czekam na pochwa\u0142y.",turn:"Halina przyj\u0119\u0142a szarlotk\u0119",done:"Zgoda? I powiedzia\u0142a, \u017Ce jej przepis lepszy? To znaczy, \u017Ce jej smakowa\u0142o. Masz 60 groszy i punkt. I plotk\u0119: Pan Zdzisiek ma podobno pacho\u0142ek z certyfikatem.",reward:{c:60,xp:60,p:1},steps:[{t:"item",z:1,tx:20,ty:29,name:"Dzikie jab\u0142ka",ic:"jablka",hint:"\u0141\u0105ka Czekania: samo po\u0142udnie",fin:"Kosz dzikich jab\u0142ek. Kwa\u015Bne jak mina Pani Kamili przed kaw\u0105. Teraz cynamon od Igi z Apteki."},{t:"talk",to:"iga",ask:"Gra\u017Cyna prosi o szczypt\u0119 cynamonu",hint:"Iga, Apteka w Wiosce",txt:"Cynamon? Mam. Leczy, rozgrzewa i ko\u0144czy k\u0142\xF3tnie rodzinne. Nie wszystkie, ale te o szarlotk\u0119 zawsze. Pozdr\xF3w Gra\u017Cyn\u0119 i powiedz, \u017Ce nie sprzedaj\u0119 plotek na recept\u0119.",ok:"Bior\u0119 cynamon"},{t:"talk",to:"grazyna",ask:"Mam jab\u0142ka i cynamon",hint:"Gra\u017Cyna, Wioska (przy karczmie)",txt:"Pieczemy! (Czterdzie\u015Bci minut i trzy plotki p\xF3\u017Aniej.) Gotowe! Ciep\u0142a, z kruszonk\u0105. Zanie\u015B Halinie do Lasu Szept\xF3w. Jej chata jest na wschodzie. Nie biegaj z ni\u0105 po krzakach.",ok:"Nios\u0119 do Haliny"},{t:"talk",to:"halina",ask:"Szarlotka na zgod\u0119 od Gra\u017Cyny",hint:"Wied\u017Ama Halina, Las Szept\xF3w (wsch\xF3d)",txt:"Od Gra\u017Cynki? Hmpf. Z kruszonk\u0105? ...No dobra. Zgoda. Ale przepis i tak mam lepszy. Powiedz jej to delikatnie. Albo wcale.",ok:"Przeka\u017C\u0119... delikatnie"}]},{id:"gra2",name:"Plotka obiegowa",giver:"grazyna",after:"gra1",ask:"Ma pani co\u015B nowego?",offer:"Mam! Bogdan farbuje brod\u0119. Na bia\u0142o. \u017Beby wygl\u0105da\u0107 m\u0105drzej. Rozpu\u015B\u0107 to: Ola na \u0141\u0105ce, Edek w Lesie, Staszek na Zachodnich Polach. Potem wr\xF3\u0107 i powiedz, w jakiej wersji plotka do mnie wr\xF3ci\u0142a. To naukowy eksperyment.",accept:"M\xF3w z przekonaniem. Plotka bez przekonania to tylko informacja.",prog:"Plotka obieg\u0142a {s}/3 s\u0142uchaczy. Czekam, a\u017C wr\xF3ci z odsetkami.",turn:"Plotka obieg\u0142a okolic\u0119",done:"Wr\xF3ci\u0142a do mnie wersja, \u017Ce to JA farbuj\u0119 brod\u0119. Ja nie mam brody! ...Prawda? Dobra, nauka wymaga ofiar. Masz 45 groszy.",reward:{c:45,xp:60},steps:[{t:"talk",to:"ola",ask:"S\u0142ysza\u0142a\u015B, \u017Ce Bogdan farbuje brod\u0119?",hint:"Pasterka Ola, \u0141\u0105ka Czekania",txt:"Bogdan? Brod\u0119? Na bia\u0142o? Nie wierz\u0119! ...Powiem owcom. Owce powiedz\u0105 baranowi. Baran nikomu, bo nie odpowiada. Jak support.",ok:"Id\u0119 dalej"},{t:"talk",to:"edek",ask:"S\u0142ysza\u0142 pan, \u017Ce Bogdan farbuje brod\u0119?",hint:"Grzybiarz Edek, Las Szept\xF3w",txt:"Farbuje? Pewnie grzybami! Bia\u0142y... to musi by\u0107 purchawka. Powiem so\u015Bnie, ona zna wszystkich.",ok:"Super, dzi\u0119ki"},{t:"talk",to:"staszek",ask:"S\u0142ysza\u0142e\u015B, \u017Ce Bogdan farbuje brod\u0119?",hint:"Staszek, Zachodnie Pola Ticket\xF3w",txt:"Bogdan? My\u015Bla\u0142em, \u017Ce to Gra\u017Cyna farbuje! Zaraz... a mo\u017Ce farbuje si\u0119 broda Bogdana na Gra\u017Cyn\u0119? Niewa\u017Cne, przeka\u017C\u0119 dalej. Ticketom te\u017C.",ok:"Wracam do Gra\u017Cyny"}]},{id:"fil2",name:"Pi\u0142ka w kropki",giver:"filip",ask:"Czemu masz tak\u0105 min\u0119?",offer:"Kopn\u0105\u0142em pi\u0142k\u0119 tak mocno, \u017Ce przelecia\u0142a przez ca\u0142\u0105 \u0141\u0105k\u0119! My\u015Bliwy Zenek wszystko widzi, bo siedzi w krzakach ca\u0142ymi dniami. Zapytaj go. Mama m\xF3wi, \u017Ce jak jej nie znajd\u0119, now\u0105 dostan\u0119 dopiero na urodziny. A urodziny s\u0105 za STO dni.",accept:"Jest czerwona w bia\u0142e kropki. Gluty si\u0119 jej boj\u0105, bo my\u015Bl\u0105, \u017Ce to muchomor.",prog:"Pi\u0142ka dalej w \u015Bwiecie. Do urodzin zosta\u0142o sto dni minus jeden.",turn:"Oddaj pi\u0142k\u0119",done:"MOJA PI\u0141KA! Nadgryziona, ale moja! Jeste\u015B najlepsza! Masz 20 groszy i punkt rozwoju. Taki prawdziwy, z gry.",reward:{c:20,xp:50,p:1},steps:[{t:"talk",to:"zenek",ask:"Widzia\u0142 pan czerwon\u0105 pi\u0142k\u0119 w kropki?",hint:"My\u015Bliwy Zenek, \u0141\u0105ka Czekania (po\u0142udniowy wsch\xF3d)",txt:"Widzia\u0142em. Nietoperz j\u0105 porwa\u0142 do Lasu Szept\xF3w, my\u015Bla\u0142, \u017Ce to muchomor z bonusem. Te nietoperze to banda. Przego\u0144 kilka, to reszta wypu\u015Bci \u0142up.",ok:"Przegoni\u0119 nietoperze"},{t:"kill",kind:"bat",z:2,n:3,at:[[20,11],[35,23],[10,30]],hint:"przego\u0144 nietoperze w Lesie Szept\xF3w",fin:"Ostatni nietoperz pisn\u0105\u0142 i upu\u015Bci\u0142 co\u015B czerwonego. Polecia\u0142o na p\xF3\u0142nocny wsch\xF3d lasu!"},{t:"item",z:2,tx:50,ty:4,name:"Pi\u0142ka w kropki",ic:"fil2",hint:"Las Szept\xF3w: p\xF3\u0142nocny wsch\xF3d",fin:"Pi\u0142ka! Lekko nadgryziona, ale wci\u0105\u017C okr\u0105g\u0142a. Wracaj do Filipa."}]},{id:"fil1",name:"Zagadki Filipa",giver:"filip",after:"fil2",gate:["seal"],ask:"Masz dla mnie jak\u0105\u015B zagadk\u0119?",offer:"Mia\u0142em! Ca\u0142a ksi\u0119ga zagadek taty. Ale tata zgubi\u0142 j\u0105 w Ruinach Kolejki, jak ucieka\u0142 przed zg\u0142oszeniem, kt\xF3re go goni\u0142o. Przyniesiesz? Wtedy zadam ci trzy najtrudniejsze i dostaniesz moje najcenniejsze grosze.",accept:"Ruiny s\u0105 na p\xF3\u0142noc od Wioski, za t\u0105 bram\u0105 z Piecz\u0119ci\u0105. Ksi\u0119ga ma \u017C\xF3\u0142t\u0105 ok\u0142adk\u0119 i pachnie strachem.",prog:"Bez ksi\u0119gi znam tylko jedn\u0105 zagadk\u0119: co jest zielone i skacze? Glut. Nie skacze? To dalej glut.",quiz:[{q:"Co ma z\u0119by, ale nie gryzie?",a:["Grzebie\u0144","Glut","Pani Kamila przed kaw\u0105"],ok:0},{q:"Co biegnie, chocia\u017C nie ma n\xF3g?",a:["Kolejka do supportu","Czas","Mruczek po kie\u0142bas\u0119"],ok:1},{q:"Im wi\u0119cej z niej zabierasz, tym wi\u0119ksza si\u0119 robi. Co to?",a:["Dziura w drodze","Kupka grzyb\xF3w","Kiesze\u0144 Mietka"],ok:0}],wrong:"Hahaha, nie! Od pocz\u0105tku. M\xF3j tata te\u017C za pierwszym razem nie zgad\u0142.",turn:"Mam ksi\u0119g\u0119, dawaj zagadki",done:"Wszystkie dobrze! Jeste\u015B m\u0105drzejsza od mojego taty, ale nie m\xF3w mu. Masz 40 groszy, to ca\u0142y m\xF3j maj\u0105tek plus kieszonkowe na przysz\u0142y miesi\u0105c.",reward:{c:40,xp:60},steps:[{t:"item",z:4,tx:30,ty:22,name:"Ksi\u0119ga Zagadek",ic:"ksiega",hint:"Ruiny Kolejki Zg\u0142osze\u0144: g\u0142\xF3wny hol",fin:"Ksi\u0119ga Zagadek! Na marginesach tata dopisa\u0142 odpowiedzi. Po\u0142owa jest b\u0142\u0119dna. Brakuje ostatniej strony, a na ok\u0142adce stoi: \u201EPo\u017Cyczone Zbyszkowi na rymy\u201D. Bard siedzi w karczmie w Wiosce."},{t:"talk",to:"zbyszek",ask:"Masz ostatni\u0105 stron\u0119 Ksi\u0119gi Zagadek?",hint:"Bard Zbyszek, Karczma w Wiosce",txt:"Ostatnia strona? A, ta! U\u017Cywa\u0142em jej jako podk\u0142adki pod kufel. Rymy wysz\u0142y mokre, ale \u0142adne. Prosz\u0119, tylko nie czytaj na g\u0142os, bo rymuje si\u0119 z \u201Eglut\u201D.",ok:"Dzi\u0119ki, Zbyszku"}]},{id:"dar1",name:"Paczka bez adresu",giver:"darek",ask:"Pan kurier? Co si\u0119 sta\u0142o?",offer:"Mam paczk\u0119 bez adresu, czyli tak\u0105, kt\xF3ra dostarcza si\u0119 sama. No i si\u0119 dostarczy\u0142a, gdzie\u015B na Zachodnie Pola Ticket\xF3w. Status w systemie: \u201EPaczka w drodze\u201D. Od trzech tygodni. Znajd\u017A chocia\u017C awizo, to b\u0119d\u0119 wiedzia\u0142, gdzie jej szuka\u0107.",accept:"Awizo zostawiam zwykle w najdziwniejszym miejscu. Na Polach to pewnie gdzie\u015B na po\u0142udniowym zachodzie, tam nikt nie chodzi.",prog:"Paczka wci\u0105\u017C w drodze. Status: \u201Eawizo zostawione w krzakach\u201D.",turn:"Paczka dor\u0119czona",done:"Dor\u0119czono do r\u0105k w\u0142asnych Pustelnika Mirka? To on jeszcze \u017Cyje? Pip! Status: \u201EDor\u0119czono\u201D. System jest zadowolony, ja te\u017C. Masz 75 groszy i punkt.",reward:{c:75,xp:80,p:1},steps:[{t:"item",z:9,tx:6,ty:24,name:"Awizo",ic:"awizo",hint:"Zachodnie Pola Ticket\xF3w: po\u0142udniowy zach\xF3d",fin:"Awizo: \u201EPaczka przekierowana do Depotu Zagubionych Paczek. Odbi\xF3r osobisty. Adresat: \xBBPustelnik, Bagna\xAB\u201D. Depot jest na p\xF3\u0142nocnym zachodzie P\xF3l."},{t:"item",z:10,tx:6,ty:6,name:"Paczka bez adresu",ic:"dar1",hint:"Depot Zagubionych Paczek (p\xF3\u0142nocny zach\xF3d P\xF3l)",fin:"Paczka! Na boku kto\u015B dopisa\u0142: \u201EMirek, Bagna SLA\u201D. Pora na dor\u0119czenie, Bagna s\u0105 na po\u0142udnie od Wioski."},{t:"talk",to:"mirek",ask:"Czy to pana paczka?",hint:"Pustelnik Mirek, Po\u0142udniowe Bagna SLA",txt:"Moja! Zam\xF3wi\u0142em j\u0105 trzy lata temu: zestaw \u201ECisza i spok\xF3j\u201D. W \u015Brodku... dzwonek do drzwi. Ironia losu. Powiedz kurierowi, \u017Ce odebrane. I \u017Ce nie mam drzwi.",ok:"Przeka\u017C\u0119 Darkowi"}]},{id:"dar2",name:"Polecony za potwierdzeniem",giver:"darek",after:"dar1",gate:["undead"],ask:"Znowu co\u015B do dor\u0119czenia?",offer:"Polecony do Krainy Nieumar\u0142ego Supportu! Adresat: sta\u017Cysta Kuba. Ja tam nie p\xF3jd\u0119, tam wszystko jest na czas nieokre\u015Blony, a ja mam umow\u0119 na czas okre\u015Blony. Potrzebuj\u0119 podpisu na potwierdzeniu odbioru.",accept:"Sta\u017Cysta na pewno tam jest. Sta\u017Cy\u015Bci zawsze s\u0105. Nawet jak ich nie ma.",prog:"Potwierdzenie odbioru wci\u0105\u017C puste. System ju\u017C dzwoni. Do mnie.",turn:"Mam podpisane potwierdzenie",done:"Podpis jest! Troch\u0119 dr\u017C\u0105cy, ale prawdziwy. Status: \u201EDor\u0119czono w za\u015Bwiatach\u201D. Nowa kategoria w systemie! Masz 90 groszy i punkt.",reward:{c:90,xp:110,p:1},steps:[{t:"talk",to:"kuba",ask:"Polecony dla sta\u017Cysty Kuby",hint:"Sta\u017Cysta Kuba, Kraina Nieumar\u0142ego Supportu",txt:"Do mnie? Polecony?! ...To umowa o prac\u0119! Na czas nieokre\u015Blony! Podpisa\u0142bym, ale te telefony z helpdesku dzwoni\u0105 tak g\u0142o\u015Bno, \u017Ce nie s\u0142ysz\u0119 w\u0142asnych my\u015Bli. A bez my\u015Bli nie podpisuj\u0119. Ucisz ze dwa.",ok:"Ucisz\u0119 telefony"},{t:"kill",kind:"phone",z:13,n:2,at:[[20,10],[26,22]],hint:"ucisz dzwoni\u0105ce telefony w Krainie Nieumar\u0142ych",fin:"Cisza. Ostatni telefon zd\u0105\u017Cy\u0142 jeszcze powiedzie\u0107 \u201EPana po\u0142\u0105czenie jest dla nas...\u201D i zgas\u0142. Wracaj do Kuby."},{t:"talk",to:"kuba",ask:"Telefony uciszone, podpisz potwierdzenie",hint:"Sta\u017Cysta Kuba, Kraina Nieumar\u0142ych",txt:"Podpisuj\u0119! Pierwszy podpis na umowie w \u017Cyciu. Wysz\u0142o troch\u0119 krzywo, bo r\u0119ka mi dr\u017Cy ze szcz\u0119\u015Bcia. I ze strachu. G\u0142\xF3wnie ze strachu.",ok:"Gratulacje!"}]},{id:"ola1",name:"Gluty w koniczynie",giver:"ola",ask:"Gdzie s\u0105 twoje owce?",offer:"Schowa\u0142y si\u0119 w stodole, bo gluty zjadaj\u0105 mi koniczyn\u0119! Zjedz\u0105 wszystko, co zielone, a potem si\u0119 na tym po\u015Blizgn\u0105. Rozlej pi\u0119\u0107 glut\xF3w na \u0141\u0105ce, to owce wyjd\u0105.",accept:"Uwa\u017Caj, gluty s\u0105 lepkie. I nie m\xF3w owcom, \u017Ce boj\u0119 si\u0119 glut\xF3w bardziej ni\u017C one.",prog:"Owce dalej obra\u017Cone. Rozlane gluty: {n}/5.",turn:"Beczka ma dzwonek!",done:"Dzwoni! Beczka wysz\u0142a, reszta za ni\u0105, pierwsza bekn\u0119\u0142a, druga zjad\u0142a mi kapelusz. Czyli wszystko wraca do normy. Masz 55 groszy i punkt.",reward:{c:55,xp:60,p:1},steps:[{t:"kill",kind:"slime",z:1,n:5,at:[[8,21],[14,9],[27,12],[46,20],[53,12]],hint:"rozlej gluty na \u0141\u0105ce Czekania",fin:"Owce wychodz\u0105! Opr\xF3cz Beczki, najstarszej. Ola wo\u0142a: \u201EBeczka nie wyjdzie bez dzwonka! Gluty go zawlok\u0142y na strych M\u0142yna!\u201D"},{t:"item",z:33,tx:10,ty:4,name:"Dzwonek Beczki",ic:"dzwonek",hint:"Strych M\u0142yna (M\u0142yn na \u0141\u0105ce, schody w \u015Brodku)",fin:"Dzwonek! Dzy\u0144. Gdzie\u015B na \u0141\u0105ce owca podnios\u0142a g\u0142ow\u0119. Wracaj do Oli."}]},{id:"rys1",name:"Z\u0142ota b\u0142ystka",giver:"rysiek",ask:"Bior\u0105 dzisiaj?",offer:"Bior\u0105, tylko nie ryby, a gluty. Zgubi\u0142em z\u0142ot\u0105 b\u0142ystk\u0119, kiedy goni\u0142em z\u0142otego gluta. My\u015Bla\u0142em, \u017Ce to z\u0142ota rybka, a to by\u0142 zwyk\u0142y bezczelny glut. B\u0142ystka polecia\u0142a do Lasu Szept\xF3w, na wsch\xF3d.",accept:"Z\u0142ota, b\u0142yszcz\u0105ca, z haczykiem. Uwa\u017Caj na palce. I na gluty. I na moj\u0105 reputacj\u0119.",prog:"Bez b\u0142ystki \u0142owi\u0119 na kawa\u0142ek kanapki. Ryby si\u0119 ze mnie \u015Bmiej\u0105.",turn:"Oddaj naprawion\u0105 b\u0142ystk\u0119",done:"Moja b\u0142ystka! I haczyk prosty jak nigdy! Ryb\u0119, kt\xF3r\u0105 na ni\u0105 z\u0142owi\u0119, b\u0119dzie TAKA! (Rysiek rozk\u0142ada r\u0119ce coraz szerzej.) Masz 50 groszy.",reward:{c:50,xp:55},steps:[{t:"item",z:2,tx:51,ty:21,name:"Z\u0142ota b\u0142ystka",ic:"rys1",hint:"Las Szept\xF3w: wsch\xF3d",fin:"B\u0142ystka! Haczyk wygi\u0119ty w precla. Z takim to ryba si\u0119 tylko po\u015Bmieje. Kowalka Wanda w Wiosce na pewno go wyklepie."},{t:"talk",to:"wanda",ask:"Wyklepie pani haczyk b\u0142ystki?",hint:"Kowalka Wanda, Ku\u017Ania w Wiosce",txt:"Haczyk krzywy jak t\u0142umaczenie Mietka z rachunku. (Brzd\u0119k, brzd\u0119k.) Prosz\u0119, prosty. Teraz z\u0142apie nawet ryb\u0119, kt\xF3ra nie chce. Nie bior\u0119 grosza, to by\u0142a rozgrzewka.",ok:"Dzi\u0119kuj\u0119, pani Wando"}]},{id:"edk1",name:"Koszyk grzybiarza",giver:"edek",ask:"Du\u017Co dzi\u015B grzyb\xF3w?",offer:"Grzyb\xF3w pe\u0142no, tylko koszyka nie mam! Odstawi\u0142em go na chwil\u0119, \u017Ceby pogada\u0107 z sosn\u0105, i nietoperze mi go zwin\u0119\u0142y. Maj\u0105 chytre oczka. Przego\u0144 te z\u0142odziejki, mo\u017Ce kt\xF3ra\u015B powie, gdzie go schowa\u0142y.",accept:"Wiklinowy, z kraciast\u0105 chusteczk\u0105. W \u015Brodku jest kanapka z d\u017Cemem, nie zjadaj.",prog:"Wci\u0105\u017C bez koszyka. Zbieram grzyby do kapelusza i mam teraz pieczark\u0119 na g\u0142owie.",turn:"Oddaj koszyk",done:"M\xF3j koszyk! I kanapka nietkni\u0119ta, szacunek. Masz 50 groszy i punkt. I rad\u0119: grzyby, kt\xF3re m\xF3wi\u0105, lepiej omija\u0107.",reward:{c:50,xp:55,p:1},steps:[{t:"kill",kind:"bat",z:2,n:3,at:[[20,11],[35,23],[10,30]],hint:"przego\u0144 nietoperze w Lesie Szept\xF3w",fin:"Ostatni nietoperz przed ucieczk\u0105 pisn\u0105\u0142 co\u015B o \u201Ewielkim wiatraku\u201D. Nietoperze zanios\u0142y koszyk a\u017C do M\u0142yna na \u0141\u0105ce Czekania!"},{t:"item",z:20,tx:3,ty:9,name:"Koszyk grzybiarza",ic:"edk1",hint:"Wn\u0119trze M\u0142yna (\u0141\u0105ka Czekania)",fin:"Koszyk! Kanapka w \u015Brodku, nietkni\u0119ta. Nietoperze nie lubi\u0105 d\u017Cemu. Wracaj do Edka do Lasu."}]},{id:"sta1",name:"Strach na tickety",giver:"staszek",ask:"Czemu stoisz jak strach na wr\xF3ble?",offer:"Bo jestem strachem na tickety! Tylko \u017Ce one si\u0119 mnie nie boj\u0105. Lataj\u0105, wisz\u0105 nad polem i przypominaj\u0105 o terminach. Przego\u0144 cztery, to reszta zrozumie aluzj\u0119.",accept:"Tickety strzelaj\u0105 papierem, uwa\u017Caj. Pom\xF3g\u0142bym, ale mam alergi\u0119 na formularze.",prog:"Tickety dalej wisz\u0105 nad polem. Przegonione: {n}/4.",turn:"Pole \u015Bpiewa!",done:"Cisza! S\u0142yszysz? Tylko ballada i pszenica. Pierwszy raz od lat s\u0142ysz\u0119, jak ro\u015Bnie. Masz 70 groszy i punkt. I s\u0142omk\u0119 na pami\u0105tk\u0119.",reward:{c:70,xp:80,p:1},steps:[{t:"kill",kind:"ticket",z:9,n:4,at:[[14,16],[24,22],[36,9],[40,23]],hint:"przego\u0144 tickety na Zachodnich Polach",fin:"Uciek\u0142y, ale ju\u017C wida\u0107, \u017Ce wr\xF3c\u0105. Staszek krzyczy z daleka: \u201EPotrzebna piosenka odstraszaj\u0105ca! Bard Zbyszek z karczmy w Wiosce ma ich pe\u0142no!\u201D"},{t:"talk",to:"zbyszek",ask:"Staszek prosi o piosenk\u0119 na tickety",hint:"Bard Zbyszek, Karczma w Wiosce",txt:"Piosenka odstraszaj\u0105ca? Mam! \u201EBallada o zamkni\u0119tym zg\u0142oszeniu\u201D. Tickety jej nienawidz\u0105, bo ma szcz\u0119\u015Bliwe zako\u0144czenie. Zanu\u0107 j\u0105 Staszkowi. Fa\u0142szuj \u015Bmia\u0142o, tak dzia\u0142a lepiej.",ok:"Zanuc\u0119 Staszkowi"}]},{id:"mir1",name:"Cisza na bagnach",giver:"mirek",ask:"Pustelnik na bagnach? Czemu?",offer:"Uciek\u0142em tu od zgie\u0142ku, a tu chodz\u0105 zombie z helpdesku i j\u0119cz\u0105: \u201Eczy pr\xF3bowa\u0142 pan wy\u0142\u0105czy\u0107 i w\u0142\u0105czy\u0107?\u201D. Pr\xF3bowa\u0142em. Siebie. Nie pomog\u0142o. Ucisz trzech, prosz\u0119.",accept:"Tylko delikatnie, oni te\u017C kiedy\u015B byli lud\u017Ami. Konsultantami, ale jednak.",prog:"Wci\u0105\u017C s\u0142ysz\u0119 \u201EPana zg\u0142oszenie jest dla nas wa\u017Cne\u201D. Uciszone zombie: {n}/3.",turn:"Oddaj zatyczki z mchu",done:"Zatyczki! Mi\u0119towe! (wk\u0142ada) ...S\u0142ucham? Nic nie s\u0142ysz\u0119! Cudownie! Masz 70 groszy i punkt. I m\u0105dro\u015B\u0107 pustelnika: nigdy nie czytaj regulaminu do ko\u0144ca.",reward:{c:70,xp:80,p:1},steps:[{t:"kill",kind:"zombie",z:11,n:3,at:[[22,26],[8,24],[26,8]],hint:"ucisz zombie na Po\u0142udniowych Bagnach",fin:"Ciszej, ale w oddali dalej co\u015B j\u0119czy. Mirek wo\u0142a: \u201ENa reszt\u0119 pomog\u0105 tylko zatyczki z mchu! Ro\u015Bnie w Korzeniach SLA, wej\u015Bcie w starym d\u0119bie na zachodzie bagien!\u201D"},{t:"item",z:23,tx:12,ty:4,name:"Zatyczki z mchu",ic:"zatyczki",hint:"Korzenie SLA (d\u0105b na zachodzie Bagien)",fin:"Mi\u0119ciutki mech, idealny do uszu. Tylko \u017Ce co\u015B si\u0119 w nim rusza. Lepiej, \u017Ceby Iga z Apteki w Wiosce go najpierw wygotowa\u0142a."},{t:"talk",to:"iga",ask:"Wygotuje pani mech na zatyczki?",hint:"Iga, Apteka w Wiosce",txt:"Mech z Bagien SLA do uszu? Bez gotowania? Chyba \u017Ce kto\u015B lubi s\u0142ysze\u0107, jak mu w g\u0142owie kwitn\u0105 paprocie. (Bul, bul.) Gotowe, sterylne i pachn\u0105ce mi\u0119t\u0105. Zanie\u015B pustelnikowi.",ok:"Zanios\u0119 Mirkowi"}]},{id:"hen1",name:"Krecha Henia",giver:"henio",gate:["lever1"],ask:"Czemu pan taki smutny nad tym kuflem?",offer:"Kufel pusty, a Mietek m\xF3wi, \u017Ce krecha pe\u0142na. Id\u017A, pogadaj z nim, niech mi da jeszcze jedn\u0105 na krech\u0119. Tylko wiarygodnie! Tak urz\u0119dowo.",accept:"Mietek stoi za barem. Powiedz, \u017Ce Henio jest wyp\u0142acalny. Nie m\xF3w tylko od kiedy.",prog:"Kufel czeka. Ja czekam. Kufel czeka na mnie, a ja na kufel.",turn:"Krecha wymazana!",done:"Wymazana?! I lemoniada za darmo? To lepsze ni\u017C kredyt! Masz 45 groszy, znalaz\u0142em pod sto\u0142em. Nie pytaj, ile jeszcze tam le\u017Cy.",reward:{c:45,xp:55},steps:[{t:"talk",to:"mietek",ask:"Henio prosi o kolejk\u0119 na krech\u0119",hint:"Mietek, Karczma",txt:"Na krech\u0119? Jego krecha jest d\u0142u\u017Csza ni\u017C kolejka do supportu! Ale dobra: Henio zgubi\u0142 kiedy\u015B w Ruinach Kolejki moj\u0105 star\u0105 monet\u0119 karczemn\u0105, t\u0119 z dziurk\u0105. Le\u017Ca\u0142a w zachodnim skrzydle, za krat\u0105 z d\u017Awigni\u0105. Przynie\u015B j\u0105, to wyma\u017C\u0119 krech\u0119.",ok:"Poszukam monety"},{t:"item",z:4,tx:6,ty:18,name:"Moneta z dziurk\u0105",ic:"moneta",hint:"Ruiny Kolejki: zachodnie skrzyd\u0142o (za krat\u0105)",fin:"Moneta z dziurk\u0105! Przez dziurk\u0119 wida\u0107, jak bardzo Henio jest zad\u0142u\u017Cony. Wracaj do Mietka."},{t:"talk",to:"mietek",ask:"Mam monet\u0119 Henia",hint:"Mietek, Karczma",txt:"Prawdziwa! Pami\u0119tam, jak za ni\u0105 kupi\u0142em pierwszy kocio\u0142. Krecha Henia: wymazana. Lemoniada na koszt firmy. Jedna! Niech przestanie \u015Bpiewa\u0107 z bardem.",ok:"Przeka\u017C\u0119 Heniowi"}]},{id:"kub1",name:"Raport sta\u017Cysty",giver:"kuba",ask:"Sta\u017Cysta w Krainie Nieumar\u0142ych?",offer:"Mam zanie\u015B\u0107 raport kwartalny Duchowi Helpdesku, ale boj\u0119 si\u0119 duch\xF3w. I raport\xF3w. Kierownik m\xF3wi, \u017Ce sta\u017C to przygoda. Zaniesiesz za mnie?",accept:"Duch unosi si\u0119 na zach\xF3d od g\u0142\xF3wnej \u015Bcie\u017Cki. M\xF3wi \u201Eprosz\u0119 czeka\u0107\u201D, wi\u0119c pewnie jeszcze tam jest.",prog:"Raport wci\u0105\u017C w obiegu. Ja wci\u0105\u017C na sta\u017Cu. Czwarty rok.",turn:"Raport zatwierdzony",done:"Zatwierdzony bez czytania?! To najwy\u017Csza forma uznania w korporacji! Masz 80 groszy i punkt. Mo\u017Ce wreszcie mnie zatrudni\u0105.",reward:{c:80,xp:100,p:1},steps:[{t:"talk",to:"ghost",ask:"Raport kwartalny od sta\u017Cysty Kuby",hint:"Duch Helpdesku, Kraina Nieumar\u0142ych (zach\xF3d od \u015Bcie\u017Cki)",txt:"Raport bez podpisu Igi z laboratorium? Nie przyjm\u0119. Procedura. Jej laboratorium jest na zachodzie tej krainy. Prosz\u0119 czeka\u0107... a, nie, to pani ma i\u015B\u0107.",ok:"Id\u0119 do Igi"},{t:"talk",to:"iga",ask:"Duch prosi o podpis pod raportem Kuby",hint:"Iga, Laboratorium Polowe (zach\xF3d Krainy Nieumar\u0142ych)",txt:"Podpis? Prosz\u0119. Wyszed\u0142 troch\u0119 zielony, bo pisa\u0142am fiolk\u0105. Jak duch marudzi, powiedz, \u017Ce to tusz archiwalny.",ok:"Zanios\u0119 duchowi"},{t:"talk",to:"ghost",ask:"Raport z podpisem Igi",hint:"Duch Helpdesku, Kraina Nieumar\u0142ych",txt:"Zielony podpis... tusz archiwalny, m\xF3wisz? Zatwierdzony bez czytania. Przeka\u017C sta\u017Cy\u015Bcie: kwarta\u0142 zaliczony.",ok:"Przeka\u017C\u0119 Kubie"}]}],ep={kamila:2,zdzich:2,grazyna:2,filip:3,darek:2,ola:3,edek:2,staszek:2,mirek:1,kuba:2,rysiek:0,henio:0},bp={zdzich:["Dzie\u0144 dobry! To nie jest dziura w drodze, tylko inwestycja w toku.","Pracuj\u0119 tu od rana. G\u0142\xF3wnie trzymam \u0142opat\u0119, \u017Ceby nie uciek\u0142a.","Pani Kamila m\xF3wi, \u017Ce remont sko\u0144czy si\u0119 w terminie. Nie powiedzia\u0142a w kt\xF3rym."],grazyna:["S\u0142ysza\u0142a\u015B? Mietek dolewa wody do gulaszu. A Bogdan wybiela brod\u0119, \u017Ceby wygl\u0105da\u0107 m\u0105drzej.","Ja nie plotkuj\u0119. Ja tylko szybko przekazuj\u0119 informacje dalej.","Bard Zbyszek \u015Bpiewa tak, \u017Ce moje pelargonie same si\u0119 zamkn\u0119\u0142y."],filip:["Cze\u015B\u0107! Jestem Filip i jestem prawie doros\u0142y. Prawie-prawie.","Umiem gwizda\u0107, liczy\u0107 do tysi\u0105ca i robi\u0107 min\u0119 jak glut. Patrz! ...No, prawie.","Jak dorosn\u0119, to b\u0119d\u0119 bohaterem. Albo kurierem. Kurier ma fajniejsze auto."],darek:["Kurier Darek. Dostawa w 24 godziny. Kt\xF3rych, tego nie precyzujemy.","Zostawi\u0142em awizo na drzewie. Drzewo nie odebra\u0142o.","Dzwoni\u0142em domofonem, ale w Wiosce nie ma domofon\xF3w, wi\u0119c krzycza\u0142em."],ola:["Owce licz\u0119 przed snem, a w dzie\u0144 to one licz\u0105 mnie.","To \u0141\u0105ka Czekania, bo owce czekaj\u0105 na traw\u0119, a trawa na deszcz.","M\xF3j baran nazywa si\u0119 Support, bo te\u017C nigdy nie odpowiada."],rysiek:["Ciii... ryby s\u0142uchaj\u0105.","Raz z\u0142owi\u0142em tak\u0105 ryb\u0119, \u017Ce sama nie uwierzy\u0142a.","W\u0119dkarstwo to cierpliwo\u015B\u0107. Prawie jak czekanie na support, tylko czasem co\u015B bierze."],edek:["Grzyby to moje \u017Cycie. Gluty to moja zmora:
